<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base target="_top">
<title>Caixa</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%231D5A43'/%3E%3Cpath d='M356 170a140 140 0 1 0 0 172' fill='none' stroke='%23fff' stroke-width='56' stroke-linecap='round'/%3E%3Cpath d='M300 296l88-88M332 202h58v58' fill='none' stroke='%236CC39C' stroke-width='40' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --surface-2:#F6F8F6; --ink:#16211B; --muted:#5B6961; --line:#D9E0DB;
  --brand:#1D5A43; --brand-ink:#FFFFFF; --brand-soft:#E1EDE6;
  --in:#1F7F55; --out:#B03548; --card:#A87718; --warn:#9A6A00;
  --radius-l:18px; --radius-s:8px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1411; --surface:#161E1A; --surface-2:#1B2520; --ink:#E6ECE8; --muted:#97A59D; --line:#28332D;
    --brand:#6CC39C; --brand-ink:#0E1411; --brand-soft:#1D2C25;
    --in:#62C592; --out:#EC7A8A; --card:#DDB35A; --warn:#E0B24F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#161E1A; --surface-2:#1B2520; --ink:#E6ECE8; --muted:#97A59D; --line:#28332D;
  --brand:#6CC39C; --brand-ink:#0E1411; --brand-soft:#1D2C25;
  --in:#62C592; --out:#EC7A8A; --card:#DDB35A; --warn:#E0B24F; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.hidden{display:none!important}

/* shell */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:22px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px;background:var(--surface)}
.logo{font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.logo .mark{width:30px;height:30px;flex:none;border-radius:8px}
.ws{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.ws button{border:0;background:transparent;padding:8px 6px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted)}
.ws button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--muted)}
.nav button svg{width:18px;height:18px;flex:none}
.nav button[aria-current="page"]{background:var(--brand-soft);color:var(--ink)}
.nav button:hover{color:var(--ink)}
.savenote{font-size:12px;color:var(--muted);line-height:1.4}
.navbot{margin-top:auto}
.savenote b{display:block;color:var(--ink);font-weight:600}
.savestate.warn{color:var(--warn)}
.pendbar{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;margin:0 0 16px;padding:12px 16px;border-radius:14px;border:1px solid color-mix(in srgb,var(--warn) 55%,var(--line));background:color-mix(in srgb,var(--warn) 14%,var(--surface));font-weight:600}
.pendbar .btn{margin-left:auto}
.mstate{display:none}
.savenote .links{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-top:12px}
.savenote a,.linkbtn{color:var(--brand);font-weight:700;text-decoration:none;border:0;background:none;padding:0;font-size:13px}
.logo small.area{display:block;font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:0}
.logo span{line-height:1.1}
.main{min-width:0;padding:22px clamp(16px,3vw,36px) 120px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:26px;letter-spacing:-.02em;margin:0 auto 0 0;font-weight:800}
.monthnav{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.monthnav button{border:0;background:transparent;width:38px;height:38px;border-radius:11px;font-size:18px;color:var(--muted)}
.monthnav button:hover{color:var(--ink)}
.monthnav span{min-width:148px;text-align:center;font-weight:700}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:11px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.danger{color:var(--out)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.ghost{border-color:transparent;background:transparent}
.bottom,.mtop,.fab{display:none}

/* panels */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);padding:18px 20px;min-width:0}
.panel h2{font-size:15px;margin:0 0 14px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h2 small{font-weight:500;color:var(--muted);font-size:13px}
.c12{grid-column:span 12}.c7{grid-column:span 7}.c5{grid-column:span 5}.c6{grid-column:span 6}.c4{grid-column:span 4}.c8{grid-column:span 8}
.muted{color:var(--muted)}
.in{color:var(--in)}.out{color:var(--out)}

.hero{grid-column:span 12;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:end;padding:26px 26px 24px;background:var(--brand);color:var(--brand-ink);border-radius:22px}
.hero .lbl{font-size:14px;opacity:.85;font-weight:600}
.hero .big{font-size:clamp(34px,5.4vw,58px);font-weight:800;letter-spacing:-.035em;line-height:1.02;margin-top:6px}
.hero .sub{margin-top:8px;font-size:14px;opacity:.85}
.flow{display:grid;gap:10px}
.flow .fl{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.flow .fl b{font-size:19px;font-weight:800}
.flowbar{height:12px;border-radius:6px;background:rgba(255,255,255,.18);display:flex;overflow:hidden;gap:2px}
.flowbar span{display:block;height:100%}
.flowbar .fi{background:var(--brand-ink);opacity:.95}.flowbar .fo{background:var(--brand-ink);opacity:.4}
.flow .fl span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;background:currentColor;margin-right:7px;vertical-align:0}
.flow .fl.o span::before{opacity:.4}
.hero .pend{font-size:13px;opacity:.85}

.acct{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.acct:first-of-type{border-top:0}
.acct .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .nm small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.acct .v{font-weight:700;text-align:right}
.acct .v small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.total{display:flex;justify-content:space-between;padding-top:10px;margin-top:4px;border-top:2px solid var(--ink);font-weight:800}

.bars{display:grid;gap:4px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:7px 8px;border-radius:10px;border:0;background:transparent;text-align:left;width:100%}
button.brow:hover{background:var(--surface-2)}
.brow .bn{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.brow .bn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bv{font-weight:700;text-align:right}
.brow .bv small{color:var(--muted);font-weight:500;margin-left:6px}
.brow .track{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.brow .track i{display:block;height:100%;border-radius:3px}
.brow.child{padding-left:26px}
.brow.child .bn{font-weight:500}
.chev{color:var(--muted);font-size:12px;width:12px;display:inline-block;transition:transform .15s}
.open .chev{transform:rotate(90deg)}

.evo svg{width:100%;height:auto;display:block}
.evo .leg{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:6px}
.evo .leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.empty{padding:28px 10px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty .btn{margin-top:14px}

/* list */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.filters input,.filters select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.filters input{flex:1 1 200px}
.filters select{flex:0 1 170px}
.day{margin-top:14px}
.day h3{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 6px 4px;display:flex;justify-content:space-between}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:transparent;flex:none;padding:0;display:grid;place-items:center}
.chk.on{border-color:var(--in);background:var(--in)}
.chk.on::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.chk.card{border-color:var(--card);border-style:dashed}
.rmain{flex:1;min-width:0}
.rdesc{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rmeta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:1px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--brand-soft);color:var(--ink);font-weight:600}
.inst{font-size:12px;font-weight:600;color:var(--muted);margin-left:6px}
.ramt{font-weight:700;white-space:nowrap;text-align:right}
.ramt small{display:block;font-size:12px;font-weight:600;color:var(--warn)}
.sumbar{display:flex;flex-wrap:wrap;gap:8px 26px;margin-top:16px;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;font-size:14px}
.sumbar b{font-size:17px;display:block}

/* cards view */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.inv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 22px;margin-bottom:16px}
.inv div small{display:block;color:var(--muted);font-size:13px;font-weight:600}
.inv div b{font-size:20px}
.status{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid currentColor}
.limit{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin:6px 0 2px}
.limit i{display:block;height:100%;background:var(--card)}

/* registers */
.reg{display:grid;gap:0}
.regrow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line)}
.regrow:first-child{border-top:0}
.regrow .nm{flex:1;min-width:0;font-weight:600}
.regrow .nm small{display:block;color:var(--muted);font-weight:500;font-size:12.5px}
.regrow.sub{padding-left:26px}
.regrow.sub .nm{font-weight:500}
.acts{display:flex;gap:4px;flex:none}
.iconbtn{border:0;background:transparent;border-radius:8px;padding:5px 8px;color:var(--muted);font-size:13px;font-weight:600}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 6px 5px 12px;font-weight:600;font-size:14px}
.chip small{color:var(--muted);font-weight:500}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,16,13,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:20px;width:min(560px,100%);max-height:calc(100% - 20px);overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 6px}
.mhead h2{margin:0;font-size:19px}
.mbody{padding:10px 20px 6px;display:grid;gap:14px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px 20px;flex-wrap:wrap}
.mfoot .left{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
.f{display:grid;gap:5px}
.f label{font-size:13px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.f textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.amount input{font-size:26px;font-weight:800;padding:8px 12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:8px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg button[aria-pressed="true"].t-despesa{color:var(--out)}
.seg button[aria-pressed="true"].t-receita{color:var(--in)}
.tagpick{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tagpick button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.tagpick button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.tagpick input{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:4px 11px;font-size:13px;width:130px}
.check{display:flex;align-items:center;gap:8px;font-weight:600}
.check input{width:18px;height:18px;accent-color:var(--brand)}
.hint{font-size:12.5px;color:var(--muted)}
.colors{display:flex;gap:6px;flex-wrap:wrap}
.colors button{width:26px;height:26px;border-radius:8px;border:2px solid transparent;padding:0}
.colors button[aria-pressed="true"]{border-color:var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px)}
#toast.show{opacity:1}
.welcome{max-width:560px;margin:6vh auto;text-align:left}
.welcome h2{font-size:30px;letter-spacing:-.02em;margin:0 0 10px}
.welcome p{color:var(--muted);margin:0 0 20px}
.welcome .btns{display:flex;gap:10px;flex-wrap:wrap}
.loading{padding:60px 0;text-align:center;color:var(--muted)}

/* navegação extra */
.switch{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:8px 11px;font-weight:700;font-size:13px;text-decoration:none;cursor:pointer;width:max-content}
.switch svg{width:16px;height:16px;color:var(--brand)}
.switch:hover{border-color:var(--muted)}
.tacts{display:flex;align-items:center;gap:6px}
.icbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);padding:0}
.icbtn svg{width:19px;height:19px}
.icbtn[aria-current="page"]{color:var(--brand);border-color:var(--brand)}
.back{border:0;background:transparent;color:var(--brand);font-weight:700;padding:0;margin:0 0 8px;font-size:14px}
.top h1{display:flex;align-items:center;gap:10px}
.sw.big{width:14px;height:14px;border-radius:4px}
/* contas */
.panel.flush{padding:0;overflow:hidden}
.accrow{display:flex;align-items:center;gap:12px;width:100%;padding:15px 18px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left}
.accs .accrow:first-child{border-top:0}
.accrow:hover{background:var(--surface-2)}
.accrow .nm{flex:1;min-width:0;font-weight:700;font-size:16px}
.accrow .nm small{display:block;color:var(--muted);font-weight:500;font-size:12.5px}
.accrow .v{text-align:right;font-weight:800;font-size:17px;white-space:nowrap}
.accrow .v small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.accrow .go{color:var(--muted);font-size:22px;line-height:1}
.alert{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;border:1px solid color-mix(in srgb,var(--out) 45%,var(--line));background:color-mix(in srgb,var(--out) 8%,var(--surface));border-radius:var(--radius-l);padding:14px 18px}
.alert b{color:var(--out)}
.alert .btn{margin-left:auto}
.late{color:var(--out);font-weight:700}
.sumbar.top{margin:0 0 6px}
/* resumo, baixa, atrasadas */
.bigamt{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.dtitle{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;margin-top:4px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:9px 18px;margin:0;padding:14px 0 0;border-top:1px solid var(--line)}
.kv dt{color:var(--muted);font-size:13px;font-weight:600}
.kv dd{margin:0;font-weight:600;min-width:0}
.odlist{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.odrow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.odrow:first-child{border-top:0}
.odrow .nm{flex:1;min-width:0;font-weight:600}
.odrow .nm small{display:block;color:var(--muted);font-weight:500;font-size:12.5px}
.odrow .v{font-weight:700;white-space:nowrap}
.seg.inline{display:inline-grid;flex:0 1 auto}
.seg.inline button{padding:6px 10px;font-size:13px}
.filters input[type=date]{flex:0 1 160px}
/* dívidas */
.debts{display:grid;gap:14px}
.panel.debt h2{font-size:17px}
.dealbox{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 18px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);margin-bottom:12px}
.dealbox small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.dealbox b{font-size:17px}
.acts.wrap{flex-wrap:wrap;margin-left:-8px}
.debtcard{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap}
.debtcard .btn{margin-left:auto}

@media (max-width:1000px){
  .c7,.c5,.c6,.c4,.c8{grid-column:span 12}
}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .mtop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 0}
  .mtop .logo{font-size:19px}
  .mtop .switch{padding:7px 9px}
  .kv{grid-template-columns:1fr;gap:2px}
  .kv dd{margin-bottom:8px}
  .alert .btn,.debtcard .btn{margin-left:0;width:100%}
  .dealbox{grid-template-columns:1fr 1fr}
  .mstate{display:block;padding:4px 16px 0;font-size:12px;color:var(--muted)}
  .main{padding:14px 14px 130px}
  .top h1{font-size:22px;width:100%}
  .top .addbtn{display:none}

<script>
"use strict";
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MES_CURTO = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const COLORS = ['#1D7A5A','#2F6FB0','#B03548','#A87718','#7A4FB0','#C2562B','#2E8C8C','#6A7B2A','#B0437E','#55606B','#3F9C5A','#8C5A2B'];
const ACC_KIND = { corrente: 'Conta corrente', poupanca: 'Poupança', carteira: 'Dinheiro / carteira', investimento: 'Investimento', outra: 'Outra' };
const clone = o => JSON.parse(JSON.stringify(o));
const newId = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
function parseMoney(v){
  if (typeof v === 'number') return v;
  let s = String(v || '').replace(/[^\d,.-]/g, '');
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(s); return isNaN(n) ? 0 : r2(n);
}
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); return true; } catch(e){ return false; } }
function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} }
const pad = n => String(n).padStart(2, '0');
function todayStr(){ const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
const keyOf = date => date.slice(0, 7);
const idxOfKey = k => { const [y, m] = k.split('-').map(Number); return y * 12 + (m - 1); };
const keyOfIdx = i => `${Math.floor(i / 12)}-${pad(i % 12 + 1)}`;
const addMonthsKey = (k, n) => keyOfIdx(idxOfKey(k) + n);
const daysIn = (y, m) => new Date(y, m, 0).getDate();
function addMonthsDate(date, n){
  const [y, m, d] = date.split('-').map(Number);
  const i = y * 12 + (m - 1) + n, ny = Math.floor(i / 12), nm = i % 12 + 1;
  return `${ny}-${pad(nm)}-${pad(Math.min(d, daysIn(ny, nm)))}`;
}
const monthLabel = k => { const [y, m] = k.split('-').map(Number); return `${MESES[m-1]} ${y}`; };
const fmtDate = d => { const [y, m, dd] = d.split('-'); return `${dd}/${m}/${y}`; };
function dayLabel(d){
  const t = todayStr(); if (d === t) return 'Hoje';
  if (d === addDays(t, -1)) return 'Ontem';
  const dt = new Date(d + 'T12:00'); const w = dt.toLocaleDateString('pt-BR', { weekday: 'long' });
  return `${w.charAt(0).toUpperCase() + w.slice(1)}, ${Number(d.slice(8))} de ${MESES[Number(d.slice(5,7))-1].toLowerCase()}`;
}
function addDays(d, n){ const dt = new Date(d + 'T12:00'); dt.setDate(dt.getDate() + n); return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`; }
function toast(msg, ms = 2600){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms); }

/* ---------- estado ---------- */
const S = {
  area: '', name: '', user: '', sheetUrl: '', exportUrl: '', error: '',
  view: 'contas', month: keyOf(todayStr()), acc: null, otherUrl: '',
  rep: { preset: 'mes', from: '', to: '', src: '', tag: '', regime: 'compra' }, debtTab: 'abertas', debtOpen: {},
  settings: null, months: {}, trash: [], loaded: false,
  sub: 'contas', cardSel: null, expand: {},
  filters: { q: '', src: '', cat: '', tag: '', type: '', status: '' },
  draft: null, modal: null
};

/* ---------- armazenamento (Google Planilhas) ----------
 * Toda alteração entra numa fila guardada no aparelho antes de ir para a planilha. Se a internet cair ou o Google
 * falhar, nada se perde: a fila é reenviada sozinha (também depois de fechar e abrir o app).
 * Cada lançamento leva a versão que o app conhecia; se outra pessoa alterou antes, a planilha não grava por cima
 * (conflito) e o app recarrega. Reenviar a mesma operação não duplica nada (cada uma tem um id).
 */
const run = (fn, ...args) => new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
const errMsg = e => (e && e.message) || String(e || 'erro');
const opKey = o => o.t === 'cad' ? 'cad:' + o.set + ':' + o.item.id : o.t === 'cfg' ? 'cfg:' + o.key : 'tx:' + (o.t === 'tx' ? o.tx.id : o.id);
const Store = {
  book: '', snap: {}, csnap: {}, revs: {}, outbox: [], busy: null, timer: null, retry: null, retryDelay: 0, offline: false, lastError: '', lastLoad: 0,
  key(){ return 'caixa.fila.v1.' + this.book; },
  persist(){ if (!this.book) return; if (this.outbox.length) lsSet(this.key(), JSON.stringify(this.outbox)); else lsDel(this.key()); },
  init(){ window.addEventListener('online', () => { this.flush(); if (this.fromCache) this.load(); }); this.load(); },
  restoreOutbox(){ if (!this.outbox.length){ try { const v = JSON.parse(lsGet(this.key()) || '[]'); if (Array.isArray(v)) this.outbox = v; } catch(e){} } },
  load(){
    const pwa = window.CAIXA_PWA;
    // app instalado: mostra na hora os últimos dados guardados no aparelho e atualiza em seguida
    if (pwa && !S.loaded && !this.cacheTried){ this.cacheTried = true; const c = this.readCache(); if (c){ this.book = c.book; this.restoreOutbox(); this.fromCache = c.savedAt; this.apply(c); } }
    return run('getData').then(d => {
      this.book = d.book; this.restoreOutbox();
      clearTimeout(this.reloadTimer); this.fromCache = 0; this.offline = false;
      this.apply(d); this.writeCache();
      // alterações que ainda não chegaram na planilha (sessão anterior): envia e recarrega
      if (this.outbox.length && !this.busy) return this.flush().then(() => { if (!this.outbox.length) return this.load(); });
    }).catch(e => {
      const m = errMsg(e);
      if (S.loaded && S.settings && !S.error && /NetworkError/.test(m)){ // sem sinal: continua com os dados guardados e tenta de novo
        this.offline = true; this.lastError = m; clearTimeout(this.reloadTimer); this.reloadTimer = setTimeout(() => this.load(), 20000); updateSaveState(); return;
      }
      if (m.includes('PAREAR') && pwa) lsDel(this.cacheKey()); // aparelho sem autorização não guarda dados
      S.error = m.includes('PAREAR') ? 'parear' : m.includes('PWA_SEM_CONFIG') ? 'pwaconfig' : m.includes('NAO_CONFIGURADA') ? 'config' : m.includes('SEM_ACESSO') ? 'acesso' : m;
      S.loaded = true; render();
    });
  },
  cacheKey(){ return 'caixa.cache.v1.' + (window.CAIXA_PWA ? window.CAIXA_PWA.appId : ''); },
  readCache(){ try { const c = JSON.parse(lsGet(this.cacheKey()) || 'null'); return c && c.settings && Array.isArray(c.tx) ? c : null; } catch(e){ return null; } },
  writeCache(){
    if (!window.CAIXA_PWA || !S.settings) return;
    const withRev = t => Object.assign({}, t, { rev: this.revs[t.id] || 0 });
    lsSet(this.cacheKey(), JSON.stringify({ area: S.area, name: S.name, user: S.user, book: this.book, url: S.sheetUrl, exportUrl: S.exportUrl, otherUrl: S.otherUrl,
      settings: S.settings, tx: allTx().map(withRev), trash: S.trash.map(withRev), savedAt: Date.now() }));
  },
  /** Monta o estado a partir da planilha e reaplica por cima o que ainda está na fila. */
  apply(d){
    S.area = d.area; S.name = d.name; S.user = d.user; S.sheetUrl = d.url; S.exportUrl = d.exportUrl; S.otherUrl = d.otherUrl || ''; S.settings = d.settings; S.error = '';
    this.revs = {};
    const strip = t => { this.revs[t.id] = t.rev; delete t.rev; return t; };
    S.months = {}; d.tx.forEach(t => { strip(t); const k = keyOf(t.date); (S.months[k] = S.months[k] || []).push(t); });
    S.trash = d.trash.map(strip);
    this.outbox.forEach(o => {
      if (o.t === 'cfg'){ if (o.key === 'link_outro') S.otherUrl = o.value; return; }
      if (o.t === 'cad'){ const arr = S.settings[o.set], i = arr.findIndex(x => x.id === o.item.id); if (i >= 0) arr[i] = clone(o.item); else arr.push(clone(o.item)); return; }
      const id = o.t === 'tx' ? o.tx.id : o.id, f = findTx(id), was = f ? f.t : S.trash.find(x => x.id === id);
      if (f) S.months[f.k].splice(f.i, 1);
      S.trash = S.trash.filter(x => x.id !== id);
      if (o.t === 'tx'){ const t = clone(o.tx), k = keyOf(t.date); (S.months[k] = S.months[k] || []).push(t); }
      else if (was) S.trash.unshift(Object.assign(was, { deletedAt: 'aguardando envio', deletedBy: S.user }));
    });
    this.snapshot(); S.loaded = true; this.lastLoad = Date.now(); document.title = 'Caixa — ' + S.name; render();
  },
  snapshot(){
    this.snap = Object.fromEntries(allTx().map(t => [t.id, JSON.stringify(t)]));
    this.csnap = Object.fromEntries(Object.keys(S.settings).map(k => [k, Object.fromEntries(S.settings[k].map(x => [x.id, JSON.stringify(x)]))]));
  },
  saveSettings(){ this.queue(); },
  setCfg(key, value){
    this.outbox = this.outbox.filter(o => o.sent || opKey(o) !== 'cfg:' + key);
    this.outbox.push({ t: 'cfg', opId: newId() + newId(), key, value, at: Date.now() }); this.persist(); this.flush();
  },
  saveMonth(){ this.queue(); },
  pendingWork(){ return !!this.busy || !!this.timer || this.outbox.length > 0; },
  queue(){ clearTimeout(this.timer); this.timer = setTimeout(() => { this.timer = null; this.collect(); this.flush(); }, 300); updateSaveState(); },
  /** Compara o estado atual com o último conhecido e põe as diferenças na fila. */
  collect(){
    const ops = [], oid = () => newId() + newId(), at = Date.now(); // at: quando a alteração foi feita (aviso de pendência antiga)
    Object.keys(S.settings).forEach(set => S.settings[set].forEach(item => {
      if ((this.csnap[set] || {})[item.id] !== JSON.stringify(item)) ops.push({ t: 'cad', opId: oid(), set, item: clone(item) });
    }));
    const cur = {}; allTx().forEach(t => { cur[t.id] = JSON.stringify(t); });
    Object.keys(cur).forEach(id => { if (cur[id] !== this.snap[id]){ ops.push({ t: 'tx', opId: oid(), baseRev: this.revs[id] || 0, tx: JSON.parse(cur[id]) }); S.trash = S.trash.filter(x => x.id !== id); } });
    Object.keys(this.snap).forEach(id => { if (!(id in cur)){
      ops.push({ t: 'txdel', opId: oid(), baseRev: this.revs[id] || 0, id });
      S.trash.unshift(Object.assign(JSON.parse(this.snap[id]), { deletedAt: 'agora', deletedBy: S.user }));
    } });
    ops.forEach(o => { // junta com uma operação do mesmo registro que ainda não foi enviada
      const i = this.outbox.findIndex(x => !x.sent && opKey(x) === opKey(o));
      o.at = at;
      if (i >= 0) this.outbox[i] = Object.assign(o, { opId: this.outbox[i].opId, baseRev: this.outbox[i].baseRev, at: this.outbox[i].at || at }); else this.outbox.push(o);
    });
    this.snapshot(); this.persist();
  },
  flush(){
    if (this.busy) return this.busy;
    if (this.timer){ clearTimeout(this.timer); this.timer = null; this.collect(); }
    clearTimeout(this.retry);
    if (!this.outbox.length){ updateSaveState(); return Promise.resolve(); }
    const batch = this.outbox.slice(0, 200); batch.forEach(o => { o.sent = true; }); this.persist();
    const p = run('save', { ops: batch.map(o => { const c = Object.assign({}, o); delete c.sent; return c; }) }).then(r => {
      const done = new Set(batch.map(o => o.opId));
      this.outbox = this.outbox.filter(o => !done.has(o.opId));
      Object.entries(r.revs || {}).forEach(([id, rev]) => {
        this.revs[id] = rev;
        this.outbox.forEach(o => { if (opKey(o) === 'tx:' + id) o.baseRev = rev; });
      });
      this.offline = false; this.retryDelay = 0; this.lastError = ''; this.persist(); this.writeCache();
      const bad = (r.conflicts || []).map(c => `${c.by || 'Outra pessoa'} alterou "${c.desc || 'um lançamento'}"${c.at ? ' às ' + c.at.slice(11) : ''} antes de você. Mantive a versão que já estava na planilha; a sua ficou guardada no Histórico.`)
        .concat((r.rejected || []).map(x => `Um lançamento não foi gravado (${x.reason}). Ele ficou registrado no Histórico da planilha.`));
      this.busy = null;
      if (this.outbox.length) return this.flush();
      if (bad.length){ toast(bad.join(' '), 9000); return this.load(); }
    }, e => {
      this.busy = null; this.offline = true; this.lastError = errMsg(e);
      this.retryDelay = Math.min(60000, (this.retryDelay || 1000) * 2);
      this.retry = setTimeout(() => this.flush(), this.retryDelay);
    }).then(() => updateSaveState());
    this.busy = p; updateSaveState();
    return p;
  }
};
/** Faixa de alerta: alteração guardada no aparelho há mais de 1 hora sem chegar à planilha. */
function pendBar(){
  const n = Store.outbox.length; if (!n) return '';
  const oldest = Math.min(...Store.outbox.map(o => o.at || Date.now()));
  if (Date.now() - oldest < 3600e3) return '';
  const when = new Date(oldest).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  return `<div class="pendbar" role="alert"><span>${n} alteraç${n > 1 ? 'ões ainda não chegaram' : 'ão ainda não chegou'} à planilha (desde ${when}). ${n > 1 ? 'Estão guardadas' : 'Está guardada'} só neste aparelho: conecte-se à internet para enviar.</span><button class="btn small" data-act="reload">Enviar agora</button></div>`;
}
function saveText(){
  const n = Store.outbox.length;
  if (Store.fromCache && Store.offline) return `Sem conexão · dados de ${new Date(Store.fromCache).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}${n ? ` · ${n} alteraç${n > 1 ? 'ões guardadas' : 'ão guardada'}` : ''}`;
  if (Store.fromCache) return 'Atualizando dados…';
  if (Store.offline && n) return `${n} alteraç${n > 1 ? 'ões guardadas' : 'ão guardada'} no aparelho — tentando enviar`;
  return Store.pendingWork() ? 'Salvando…' : 'Tudo salvo na planilha';
}
function updateSaveState(){ document.querySelectorAll('.savestate').forEach(el => { el.textContent = saveText(); el.classList.toggle('warn', Store.offline && Store.outbox.length > 0); el.title = Store.lastError; }); }
function flushNow(){ if (Store.timer){ clearTimeout(Store.timer); Store.timer = null; Store.collect(); } }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden'){ flushNow(); if (Store.outbox.length) Store.flush(); return; }
  if (S.loaded && !S.error && !Store.pendingWork() && !$('#modal-root').innerHTML && Date.now() - Store.lastLoad > 30000) Store.load();
});
window.addEventListener('beforeunload', e => { flushNow(); if (Store.pendingWork()){ e.preventDefault(); e.returnValue = ''; } });

/* ---------- consultas ---------- */
const st = () => S.settings;
const catMap = () => Object.fromEntries(st().cats.map(c => [c.id, c]));
const accMap = () => Object.fromEntries(st().accounts.map(a => [a.id, a]));
const cardMap = () => Object.fromEntries(st().cards.map(c => [c.id, c]));
const tagMap = () => Object.fromEntries(st().tags.map(t => [t.id, t]));
const live = key => st()[key].filter(x => !x.archived); // cadastros não excluídos
const allTx = () => Object.values(S.months).flat();
const monthTx = k => S.months[k] || [];
function findTx(id){ for (const k in S.months){ const i = S.months[k].findIndex(t => t.id === id); if (i >= 0) return { k, i, t: S.months[k][i] }; } return null; }
function groupOf(cat, cm){ return cat && cat.parent ? (cm[cat.parent] || cat) : cat; }
function invoiceKey(card, date){
  const [y, m, d] = date.split('-').map(Number);
  let ci = y * 12 + (m - 1); if (d >= card.closeDay) ci++;
  return keyOfIdx(ci + (card.dueDay <= card.closeDay ? 1 : 0));
}
function invoiceInfo(card, k){
  const di = idxOfKey(k), ci = di - (card.dueDay <= card.closeDay ? 1 : 0);
  const [cy, cm] = keyOfIdx(ci).split('-').map(Number), [dy, dm] = k.split('-').map(Number);
  const closeDate = `${cy}-${pad(cm)}-${pad(Math.min(card.closeDay, daysIn(cy, cm)))}`;
  const dueDate = `${dy}-${pad(dm)}-${pad(Math.min(card.dueDay, daysIn(dy, dm)))}`;
  const items = allTx().filter(t => t.cardId === card.id && t.type === 'despesa' && t.invoice === k).sort((a, b) => a.date < b.date ? 1 : -1);
  const total = r2(items.reduce((s, t) => s + t.amount, 0));
  const payment = allTx().find(t => t.type === 'fatura' && t.cardId === card.id && t.invoice === k);
  const status = payment ? 'Paga' : !total ? 'Sem compras' : (todayStr() >= closeDate ? (todayStr() > dueDate ? 'Vencida' : 'Fechada') : 'Aberta');
  return { items, total, payment, status, closeDate, dueDate };
}
/* ---------- saldos ----------
 * Pago = o dinheiro já saiu/entrou, na data do pagamento (paidDate; sem ela, a própria data).
 * Pendente = previsto na data do lançamento (vencimento). Compra no cartão não mexe na conta:
 * quem mexe é a fatura, que entra no previsto da conta que paga o cartão na data de vencimento.
 */
const payDay = t => t.paidDate || t.date;
const settled = t => t.type === 'transf' || t.type === 'fatura' || !!t.paid;
const endOfMonth = k => { const [y, m] = k.split('-').map(Number); return `${k}-${pad(daysIn(y, m))}`; };
function accEffect(t, accId){ // quanto o lançamento soma (+) ou tira (−) da conta
  if (t.cardId && t.type === 'despesa') return 0;
  if (t.type === 'transf') return (t.toAccountId === accId ? t.amount : 0) - (t.accountId === accId ? t.amount : 0);
  if (t.accountId !== accId) return 0;
  return t.type === 'receita' ? t.amount : -t.amount;
}
function accountBalance(accId, until){
  const a = accMap()[accId]; let b = a ? Number(a.initial) || 0 : 0;
  allTx().forEach(t => { if (settled(t) && (!until || payDay(t) <= until)) b += accEffect(t, accId); });
  return r2(b);
}
function invDue(card, k){ const [y, m] = k.split('-').map(Number); return `${k}-${pad(Math.min(card.dueDay, daysIn(y, m)))}`; }
/** Faturas não pagas com vencimento até `until` (de uma conta pagadora, ou de todas se accId vazio). */
function openInvoices(accId, until){
  const out = [];
  st().cards.forEach(c => {
    if (accId && c.payAccount !== accId) return;
    const keys = new Set(); allTx().forEach(t => { if (t.cardId === c.id && t.type === 'despesa' && t.invoice) keys.add(t.invoice); });
    keys.forEach(k => { if (invDue(c, k) > until) return; const I = invoiceInfo(c, k); if (!I.payment && I.total > 0) out.push({ card: c, key: k, total: I.total, dueDate: I.dueDate, status: I.status }); });
  });
  return out.sort((a, b) => a.dueDate < b.dueDate ? -1 : 1);
}
function accountProjected(accId, until){
  let b = accountBalance(accId, until);
  allTx().forEach(t => { if (!settled(t) && t.date <= until) b += accEffect(t, accId); });
  openInvoices(accId, until).forEach(i => { b -= i.total; });
  return r2(b);
}
/** Lançamentos vencidos sem baixa e faturas vencidas sem pagamento. */
function overdue(){
  const today = todayStr();
  const tx = allTx().filter(t => (t.type === 'despesa' || t.type === 'receita') && !t.cardId && !t.paid && t.date < today).sort((a, b) => a.date < b.date ? -1 : 1);
  const inv = openInvoices('', addDays(today, -1));
  const pagar = r2(tx.filter(t => t.type === 'despesa').reduce((s, t) => s + t.amount, 0) + inv.reduce((s, i) => s + i.total, 0));
  const receber = r2(tx.filter(t => t.type === 'receita').reduce((s, t) => s + t.amount, 0));
  return { tx, inv, pagar, receber, count: tx.length + inv.length };
}

/* extrato de uma conta: realizados pela data do pagamento, com saldo ao fim de cada dia */
function viewExtrato(){
  const a = accMap()[S.acc], k = S.month, first = `${k}-01`, last = endOfMonth(k), today = todayStr();
  const open = accountBalance(a.id, addDays(first, -1));
  const items = allTx().map(t => ({ t, v: accEffect(t, a.id), done: settled(t), day: settled(t) ? payDay(t) : t.date }))
    .filter(x => x.v !== 0 && x.day >= first && x.day <= last);
  const invs = openInvoices(a.id, last).filter(i => i.dueDate >= first);
  const days = {};
  items.forEach(x => (days[x.day] = days[x.day] || { tx: [], inv: [] }).tx.push(x));
  invs.forEach(i => (days[i.dueDate] = days[i.dueDate] || { tx: [], inv: [] }).inv.push(i));
  let run = open, entradas = 0, saidas = 0;
  const html = Object.keys(days).sort().map(d => {
    const g = days[d];
    g.tx.sort((x, y) => (x.done === y.done ? (x.t.created || 0) - (y.t.created || 0) : x.done ? -1 : 1));
    g.tx.forEach(x => { if (!x.done) return; run = r2(run + x.v); if (x.v > 0) entradas += x.v; else saidas -= x.v; });
    const rows = g.tx.map(x => txRow(x.t, { v: x.v })).join('') + g.inv.map(invRow).join('');
    return `<div class="day"><h3><span>${dayLabel(d)}</span><span>${d <= today ? 'saldo ' + money(run) : ''}</span></h3><div class="list">${rows}</div></div>`;
  }).join('');
  const prev = accountProjected(a.id, last);
  const back = `<button class="back" data-act="accback">‹ Todas as contas</button>`;
  return topbar(`<span class="sw big" style="background:${a.color}"></span>${esc(a.name)}`, true, back) + `
    <div class="sumbar top">
      <div><span class="muted">Saldo em ${fmtDate(addDays(first, -1))}</span><b>${money(open)}</b></div>
      <div><span class="muted">Entradas</span><b class="in">${money(entradas)}</b></div>
      <div><span class="muted">Saídas</span><b class="out">${money(saidas)}</b></div>
      <div><span class="muted">Saldo ${last < today ? 'em ' + fmtDate(last) : 'hoje'}</span><b>${money(last < today ? run : accountBalance(a.id, today))}</b></div>
      <div><span class="muted">Previsto em ${fmtDate(last)}</span><b>${money(prev)}</b></div>
    </div>
    ${html || `<div class="panel"><div class="empty"><b>Sem movimento em ${monthLabel(k).toLowerCase()}</b>Use as setas para ver outros meses.</div></div>`}
    <p class="hint">Pagos aparecem na data do pagamento; pendentes (círculo vazio) na data do vencimento e só entram no previsto. Faturas de cartão entram no vencimento.</p>`;
}
function invRow(i){

/* ---------- painel (relatórios) ---------- */
const PRESETS = [['mes','Este mês'],['mespass','Mês passado'],['m3','Últimos 3 meses'],['m6','Últimos 6 meses'],['m12','Últimos 12 meses'],['ano','Este ano'],['anopass','Ano passado'],['custom','Escolher datas']];
function repRange(){
  const r = S.rep, k = keyOf(todayStr()), y = Number(k.slice(0, 4));
  const from = n => `${addMonthsKey(k, n)}-01`;
  switch (r.preset){
    case 'mespass': return [from(-1), endOfMonth(addMonthsKey(k, -1))];
    case 'm3': return [from(-2), endOfMonth(k)];
    case 'm6': return [from(-5), endOfMonth(k)];
    case 'm12': return [from(-11), endOfMonth(k)];
    case 'ano': return [`${y}-01-01`, `${y}-12-31`];
    case 'anopass': return [`${y - 1}-01-01`, `${y - 1}-12-31`];
    case 'custom': { const a = r.from || from(0), b = r.to || endOfMonth(k); return a <= b ? [a, b] : [b, a]; }
    default: return [from(0), endOfMonth(k)];
  }
}
/** Data em que o lançamento conta no relatório: compra no cartão pode contar na data da compra ou no vencimento da fatura. */
function repDate(t){
  if (S.rep.regime === 'pagamento' && t.cardId && t.type === 'despesa'){ const c = cardMap()[t.cardId]; return c && t.invoice ? invDue(c, t.invoice) : t.date; }
  return t.date;
}
function repBase(){ // filtros de conta/cartão e tag (sem o período)
  const f = S.rep;
  return allTx().filter(t => {
    if (t.type !== 'receita' && t.type !== 'despesa') return false;
    if (f.src){ const [kind, id] = f.src.split(':'); if (kind === 'a' && t.accountId !== id) return false; if (kind === 'c' && t.cardId !== id) return false; }
    if (f.tag && !(t.tags || []).includes(f.tag)) return false;
    return true;
  });
}
function totalsOf(list){
  let rec = 0, desp = 0, pr = 0, pd = 0;
  list.forEach(t => { if (t.type === 'receita'){ rec += t.amount; if (!t.paid) pr += t.amount; } else { desp += t.amount; if (!t.paid && !t.cardId) pd += t.amount; } });
  return { rec: r2(rec), desp: r2(desp), pr: r2(pr), pd: r2(pd) };
}
function periodLabel([a, b]){
  if (a.slice(8) === '01' && b === endOfMonth(keyOf(b))){
    if (keyOf(a) === keyOf(b)) return monthLabel(keyOf(a)).toLowerCase();
    if (a.slice(5) === '01-01' && b.slice(5) === '12-31' && a.slice(0, 4) === b.slice(0, 4)) return a.slice(0, 4);
    return `${MES_CURTO[Number(a.slice(5, 7)) - 1]}/${a.slice(0, 4)} a ${MES_CURTO[Number(b.slice(5, 7)) - 1]}/${b.slice(0, 4)}`;
  }
  return `${fmtDate(a)} a ${fmtDate(b)}`;
}
function viewDash(){
  const f = S.rep, rng = repRange(), [from, to] = rng, cm = catMap();
  const base = repBase(), list = base.filter(t => { const d = repDate(t); return d >= from && d <= to; });
  const T = totalsOf(list), res = r2(T.rec - T.desp), sumFlow = T.rec + T.desp || 1;
  const tags = st().tags.filter(t => !t.archived || t.id === f.tag);
  const filters = `<div class="filters">
    <select id="r-preset" data-r="preset" aria-label="Período">${PRESETS.map(([v, l]) => `<option value="${v}" ${f.preset === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
    ${f.preset === 'custom' ? `<input id="r-from" type="date" data-r="from" value="${esc(from)}" aria-label="De"><input id="r-to" type="date" data-r="to" value="${esc(to)}" aria-label="Até">` : ''}
    <select id="r-src" data-r="src" aria-label="Conta ou cartão">${srcOptions(f.src, true, 'Todas as contas e cartões')}</select>
    ${tags.length ? `<select id="r-tag" data-r="tag" aria-label="Tag"><option value="">Todas as tags</option>${tags.map(t => `<option value="${t.id}" ${f.tag === t.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select>` : ''}
    <div class="seg inline" role="group" aria-label="Compras no cartão contam em"><button type="button" data-act="regime" data-v="compra" aria-pressed="${f.regime !== 'pagamento'}">Cartão: data da compra</button><button type="button" data-act="regime" data-v="pagamento" aria-pressed="${f.regime === 'pagamento'}">Cartão: vencimento da fatura</button></div>
  </div>`;

  // despesas por categoria (com subcategorias)
  const desp = list.filter(t => t.type === 'despesa'), groups = {};
  desp.forEach(t => { const c = cm[t.catId], g = groupOf(c, cm), gid = g ? g.id : '_';
    groups[gid] = groups[gid] || { name: g ? g.name : 'Sem categoria', color: g ? g.color : 'var(--muted)', total: 0, subs: {} };
    groups[gid].total += t.amount; const sid = c ? c.id : '_'; const sn = c && c.parent ? c.name : (c ? `${c.name} (geral)` : 'Sem categoria');
    groups[gid].subs[sid] = groups[gid].subs[sid] || { name: sn, total: 0 }; groups[gid].subs[sid].total += t.amount; });
  const gl = Object.entries(groups).sort((a, b) => b[1].total - a[1].total), gmax = gl.length ? gl[0][1].total : 1;
  const catHtml = gl.length ? `<div class="bars">${gl.map(([gid, g]) => {
    const open = S.expand[gid], subs = Object.values(g.subs).sort((a, b) => b.total - a.total);
    const multi = subs.length > 1 || (subs[0] && !subs[0].name.endsWith('(geral)'));
    return `<button class="brow ${open ? 'open' : ''}" data-act="expand" data-v="${gid}" ${multi ? '' : 'disabled'} aria-expanded="${!!open}"><div class="bn">${multi ? '<span class="chev">▶</span>' : '<span class="chev"></span>'}<span class="sw" style="background:${g.color}"></span><span>${esc(g.name)}</span></div><div class="bv">${money(g.total)}<small>${Math.round(g.total / T.desp * 100)}%</small></div><div class="track"><i style="width:${g.total / gmax * 100}%;background:${g.color}"></i></div></button>`
      + (open ? subs.map(s => `<div class="brow child"><div class="bn"><span>${esc(s.name)}</span></div><div class="bv">${money(s.total)}</div><div class="track"><i style="width:${s.total / gmax * 100}%;background:${g.color};opacity:.55"></i></div></div>`).join('') : '');
  }).join('')}</div>` : `<div class="empty"><b>Sem despesas no período</b>Os gastos lançados aparecem aqui agrupados pelo plano de contas.</div>`;

  const bars = (entries, color) => { const max = entries.length ? entries[0][1].total : 1;
    return `<div class="bars">${entries.map(([n, r]) => `<div class="brow"><div class="bn">${r.dot ? `<span class="sw" style="background:${r.dot}"></span>` : ''}<span>${r.label || esc(n)}</span></div><div class="bv">${money(r.total)}</div><div class="track"><i style="width:${r.total / max * 100}%;background:${color}"></i></div></div>`).join('')}</div>`; };
  const recs = {}; list.filter(t => t.type === 'receita').forEach(t => { const c = cm[t.catId], g = groupOf(c, cm), n = g ? g.name : 'Sem categoria'; recs[n] = recs[n] || { total: 0, dot: g ? g.color : 'var(--muted)' }; recs[n].total += t.amount; });
  const rl = Object.entries(recs).sort((a, b) => b[1].total - a[1].total);
  const tm = tagMap(), tg = {}; desp.forEach(t => (t.tags || []).forEach(id => { if (tm[id]){ tg[id] = tg[id] || { total: 0, label: `<span class="tag">${esc(tm[id].name)}</span>` }; tg[id].total += t.amount; } }));
  const tl = Object.entries(tg).sort((a, b) => b[1].total - a[1].total);
  const bySrc = {}; desp.forEach(t => { const n = srcLabel(t), c = t.cardId ? cardMap()[t.cardId] : accMap()[t.accountId]; bySrc[n] = bySrc[n] || { total: 0, dot: c ? c.color : 'var(--muted)' }; bySrc[n].total += t.amount; });
  const sl = Object.entries(bySrc).sort((a, b) => b[1].total - a[1].total);
  const top = [...desp].sort((a, b) => b.amount - a.amount).slice(0, 6);
  const topHtml = top.length ? top.map(t => `<div class="acct" style="cursor:pointer" data-act="edit" data-id="${t.id}"><span class="sw" style="background:${catColor(t)}"></span><div class="nm">${esc(t.desc || catLabel(t))}<small>${esc(catLabel(t))} · ${fmtDate(t.date)}</small></div><div class="v out">${money(t.amount)}</div></div>`).join('') : `<div class="empty">Nada no período.</div>`;

  // evolução: meses do período (ou os 12 meses até o fim dele, se for um mês só)
  let ks = []; for (let k = keyOf(from); k <= keyOf(to); k = addMonthsKey(k, 1)) ks.push(k);
  if (ks.length < 2){ ks = []; for (let i = 11; i >= 0; i--) ks.push(addMonthsKey(keyOf(to), -i)); }
  if (ks.length > 36) ks = ks.slice(-36);
  const byMonth = {}; base.forEach(t => { const k = keyOf(repDate(t)); (byMonth[k] = byMonth[k] || []).push(t); });
  const evo = evoChart(ks.map(k => [k, totalsOf(byMonth[k] || [])]), keyOf(to));

  const pend = T.pr || T.pd ? `<div class="pend">Ainda pendente: ${T.pr ? money(T.pr) + ' a receber' : ''}${T.pr && T.pd ? ' e ' : ''}${T.pd ? money(T.pd) + ' a pagar' : ''}</div>` : '';
  return topbar('Painel', false) + filters + `<div class="grid">
    <section class="hero">
      <div><div class="lbl">Resultado · ${esc(periodLabel(rng))}</div><div class="big">${money(res)}</div><div class="sub">${res >= 0 ? 'Receitas acima das despesas' : 'Despesas acima das receitas'}</div></div>
      <div class="flow">
        <div class="fl"><span>Receitas</span><b>${money(T.rec)}</b></div>
        <div class="fl o"><span>Despesas</span><b>${money(T.desp)}</b></div>
        <div class="flowbar" aria-hidden="true"><span class="fi" style="width:${T.rec / sumFlow * 100}%"></span><span class="fo" style="width:${T.desp / sumFlow * 100}%"></span></div>
        ${pend}
      </div>
    </section>
    <section class="panel c7"><h2>Despesas por categoria <small>clique para abrir as subcategorias</small></h2>${catHtml}</section>
    <section class="panel c5"><h2>Receitas por categoria</h2>${rl.length ? bars(rl, 'var(--in)') : '<div class="empty">Nenhuma receita no período.</div>'}</section>
    <section class="panel c8 evo"><h2>Mês a mês</h2>${evo}</section>
    <section class="panel c4"><h2>Despesas por conta e cartão</h2>${sl.length ? bars(sl, 'var(--muted)') : '<div class="empty">Nada no período.</div>'}</section>
    <section class="panel c6"><h2>Maiores despesas</h2>${topHtml}</section>
    <section class="panel c6"><h2>Despesas por tag</h2>${tl.length ? bars(tl, 'var(--brand)') : '<div class="empty">Nenhuma despesa com tag no período.</div>'}</section>
  </div>`;
}
function evoChart(rows, cur){
  const max = Math.max(1, ...rows.map(([, d]) => Math.max(d.rec, d.desp)));
  const W = 720, H = 220, pl = 8, pb = 26, pt = 10, cw = (W - pl * 2) / rows.length, bw = Math.min(18, cw / 3);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Receitas e despesas mês a mês">`;
  for (let g = 0; g <= 3; g++){ const yy = pt + (H - pt - pb) * g / 3; s += `<line x1="${pl}" x2="${W - pl}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>`; }
  rows.forEach(([x, d], i) => {
    const cx = pl + cw * i + cw / 2, hh = H - pt - pb, hr = d.rec / max * hh, hd = d.desp / max * hh, on = x === cur;
    s += `<g><title>${monthLabel(x)} — receitas ${money(d.rec)}, despesas ${money(d.desp)}, resultado ${money(d.rec - d.desp)}</title>
      <rect x="${cx - bw - 1}" y="${H - pb - hr}" width="${bw}" height="${Math.max(hr, 0)}" rx="3" fill="var(--in)" opacity="${on ? 1 : .7}"/>
      <rect x="${cx + 1}" y="${H - pb - hd}" width="${bw}" height="${Math.max(hd, 0)}" rx="3" fill="var(--out)" opacity="${on ? 1 : .7}"/>
      <text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="12" font-weight="${on ? 800 : 500}" fill="${on ? 'var(--ink)' : 'var(--muted)'}">${MES_CURTO[Number(x.slice(5)) - 1]}${rows.length > 12 || x.slice(5) === '01' ? '/' + x.slice(2, 4) : ''}</text></g>`;
  });
  s += `</svg><div class="leg"><span><i style="background:var(--in)"></i>Receitas</span><span><i style="background:var(--out)"></i>Despesas</span><span>Máximo da escala: ${money(max)}</span></div>`;
  return s;
}

/* ---------- lançamentos ---------- */
function srcOptions(sel, includeCards = true, placeholder = ''){
  const a = st().accounts.filter(x => !x.archived || sel === 'a:' + x.id).map(x => `<option value="a:${x.id}" ${sel === 'a:' + x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('');
  const c = includeCards ? st().cards.filter(x => !x.archived || sel === 'c:' + x.id).map(x => `<option value="c:${x.id}" ${sel === 'c:' + x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('') : '';
  return (placeholder ? `<option value="">${placeholder}</option>` : '') + (a ? `<optgroup label="Contas">${a}</optgroup>` : '') + (c ? `<optgroup label="Cartões">${c}</optgroup>` : '');
}
function catOptions(type, sel, placeholder = 'Sem categoria'){
  const cats = st().cats.filter(c => (!c.archived || c.id === sel) && (!type || c.type === type));
  const groups = cats.filter(c => !c.parent);
  const lab = t => type ? '' : (t === 'receita' ? ' (receita)' : '');
  return `<option value="">${placeholder}</option>` + groups.map(g => {
    const subs = cats.filter(c => c.parent === g.id);
    return `<optgroup label="${esc(g.name)}${lab(g.type)}"><option value="${g.id}" ${sel === g.id ? 'selected' : ''}>${esc(g.name)}${subs.length ? ' (geral)' : ''}</option>${subs.map(s => `<option value="${s.id}" ${sel === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</optgroup>`;
  }).join('');
}
function filteredTx(){
  const f = S.filters, q = f.q.trim().toLowerCase(), cm = catMap(), tm = tagMap();
  return monthTx(S.month).filter(t => {
    if (f.type && t.type !== f.type) return false;
    if (f.src){ const [kind, id] = f.src.split(':'); if (kind === 'a' && t.accountId !== id && t.toAccountId !== id) return false; if (kind === 'c' && t.cardId !== id) return false; }
    if (f.cat){ const c = cm[t.catId]; if (!c || (c.id !== f.cat && c.parent !== f.cat)) return false; }
    if (f.tag && !(t.tags || []).includes(f.tag)) return false;
    if (f.status === 'pend' && (t.paid || t.cardId || t.type === 'fatura')) return false;
    if (f.status === 'ok' && !(t.paid || t.type === 'fatura')) return false;
    if (q){ const hay = [t.desc, t.note, catLabel(t), srcLabel(t), ...(t.tags || []).map(id => tm[id] ? tm[id].name : '')].join(' ').toLowerCase(); if (!hay.includes(q)) return false; }
    return true;
  }).sort((a, b) => a.date === b.date ? (b.created || 0) - (a.created || 0) : (a.date < b.date ? 1 : -1));
}
function txRow(t, o = {}){ // o.v: valor com sinal visto por uma conta (extrato)
  const tm = tagMap(), sign = o.v != null ? (o.v > 0 ? 'in' : 'out') : t.type === 'receita' ? 'in' : (t.type === 'transf' ? '' : 'out');
  const chk = t.cardId ? `<span class="chk card" title="Compra no cartão — entra na fatura"></span>`
    : t.type === 'fatura' ? `<span class="chk on" title="Pagamento de fatura"></span>`
    : `<button class="chk ${t.paid ? 'on' : ''}" data-act="toggle" data-id="${t.id}" aria-label="${t.paid ? 'Marcar como pendente' : (t.type === 'receita' ? 'Marcar como recebido' : 'Marcar como pago')}" title="${t.paid ? 'Pago' : 'Pendente'}"></button>`;
  const inst = t.inst ? `<span class="inst">${t.inst.fixed ? 'fixa ' : ''}${t.inst.n}/${t.inst.total}</span>` : '';
  const tags = (t.tags || []).filter(id => tm[id]).map(id => `<span class="tag">${esc(tm[id].name)}</span>`).join('');
  const pend = !settled(t) && !t.cardId ? `<small class="${t.date < todayStr() ? 'late' : ''}">${t.date < todayStr() ? 'atrasado' : t.type === 'receita' ? 'a receber' : 'a pagar'}</small>` : '';
  return `<div class="row" data-act="edit" data-id="${t.id}" role="button" tabindex="0">${chk}<span class="sw" style="background:${catColor(t)}"></span>
    <div class="rmain"><div class="rdesc">${esc(t.desc || catLabel(t))}${inst}</div><div class="rmeta"><span>${esc(catLabel(t))}</span><span>·</span><span>${esc(srcLabel(t))}${t.cardId && t.invoice ? ' (fatura ' + MES_CURTO[Number(t.invoice.slice(5)) - 1] + ')' : ''}</span>${t.note ? '<span title="' + esc(t.note) + '">· obs.</span>' : ''}${tags}</div></div>
    <div class="ramt ${sign}">${o.v != null ? (o.v > 0 ? '+' : '−') : t.type === 'despesa' || t.type === 'fatura' ? '−' : t.type === 'receita' ? '+' : ''}${money(t.amount)}${pend}</div></div>`;
}
function viewList(){
  const f = S.filters, list = filteredTx();
  const tags = st().tags.filter(t => !t.archived || t.id === f.tag);
  const filters = `<div class="filters">
    <input id="f-q" type="search" placeholder="Buscar descrição, observação, tag…" value="${esc(f.q)}" data-f="q" aria-label="Buscar">

  }

  let rec = 0, desp = 0; list.forEach(t => { if (t.type === 'receita') rec += t.amount; if (t.type === 'despesa') desp += t.amount; });
  return topbar('Lançamentos') + filters + Object.entries(byDay).map(([d, ts]) => {
    const net = ts.reduce((s, t) => s + (t.type === 'receita' ? t.amount : t.type === 'despesa' ? -t.amount : 0), 0);
    return `<div class="day"><h3><span>${dayLabel(d)}</span><span>${net ? money(net) : ''}</span></h3><div class="list">${ts.map(txRow).join('')}</div></div>`;
  }).join('') + `<div class="sumbar"><div><span class="muted">Receitas</span><b class="in">${money(rec)}</b></div><div><span class="muted">Despesas</span><b class="out">${money(desp)}</b></div><div><span class="muted">Resultado</span><b>${money(rec - desp)}</b></div><div><span class="muted">Lançamentos</span><b>${list.length}</b></div></div>`;
}

/* ---------- cartões ---------- */
function viewCards(){
  const cards = live('cards');
  if (!cards.length) return topbar('Cartões') + `<div class="panel"><div class="empty"><b>Nenhum cartão cadastrado</b>Cadastre seus cartões com o dia de fechamento e de vencimento para acompanhar as faturas.<br><button class="btn primary" data-act="newcard">Cadastrar cartão</button></div></div>`;
  if (!cards.find(c => c.id === S.cardSel)) S.cardSel = cards[0].id;
  const c = cardMap()[S.cardSel], I = invoiceInfo(c, S.month);
  let open = 0; const seen = new Set();
  allTx().forEach(t => { if (t.cardId === c.id && t.type === 'despesa' && !seen.has(t.invoice)){ seen.add(t.invoice); } });
  seen.forEach(k => { const x = invoiceInfo(c, k); if (!x.payment) open += x.total; });
  const lim = Number(c.limit) || 0;
  const stColor = I.status === 'Paga' ? 'var(--in)' : I.status === 'Vencida' ? 'var(--out)' : I.status === 'Fechada' ? 'var(--warn)' : 'var(--muted)';
  const pay = I.payment ? `<div class="hint">Paga em ${fmtDate(I.payment.date)} pela conta ${esc(srcLabel(I.payment))} — ${money(I.payment.amount)}</div><button class="btn small" data-act="unpay" data-id="${I.payment.id}">Desfazer pagamento</button>`
    : (I.total > 0 ? `<button class="btn primary" data-act="payinv">Pagar fatura</button>` : '');
  return topbar('Cartões') + `<div class="tabs" role="group" aria-label="Cartões">${cards.map(x => `<button data-act="cardsel" data-v="${x.id}" aria-pressed="${x.id === c.id}">${esc(x.name)}</button>`).join('')}</div>
    <div class="panel">
      <h2>Fatura com vencimento em ${fmtDate(I.dueDate)} <span class="status" style="color:${stColor}">${I.status}</span></h2>
      <div class="inv">
        <div><small>Total da fatura</small><b>${money(I.total)}</b></div>
        <div><small>Fechamento</small><b>${fmtDate(I.closeDate)}</b></div>
        ${lim ? `<div><small>Limite disponível</small><b>${money(lim - open)}</b><div class="limit"><i style="width:${Math.min(100, open / lim * 100)}%"></i></div><small>${money(open)} de ${money(lim)} em uso</small></div>` : ''}
      </div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px">${pay}</div>
      ${I.items.length ? `<div class="list">${I.items.map(txRow).join('')}</div>` : `<div class="empty">Nenhuma compra nesta fatura. Use as setas do mês para ver outras faturas.</div>`}
    </div>`;
}

    const sets = [['accounts', 'Conta'], ['cards', 'Cartão'], ['cats', 'Categoria'], ['tags', 'Tag'], ['debts', 'Dívida']];

}

function rerenderModal(){

function addTagFromDraft(){
  const d = S.draft, n = (d.newTag || '').trim(); if (!n) return;
  let t = st().tags.find(x => x.name.toLowerCase() === n.toLowerCase());
  if (!t){ t = { id: newId(), name: n }; st().tags.push(t); Store.saveSettings(); } else if (t.archived){ t.archived = false; Store.saveSettings(); }
  if (!d.tags.includes(t.id)) d.tags.push(t.id);
  d.newTag = ''; rerenderModal(); const i = $('#d-newtag'); if (i) i.focus();
}
function saveTx(){
  const d = S.draft; addTagFromDraftSilent();
  const amount = parseMoney(d.amount);
  if (!(amount > 0)) return toast('Informe um valor maior que zero.');
  if (!d.date) return toast('Informe a data.');
  if (!d.src) return toast(d.type === 'transf' ? 'Escolha a conta de saída.' : 'Escolha a conta' + (d.type === 'despesa' ? ' ou o cartão.' : '.'));
  if (d.type === 'transf'){ if (!d.to) return toast('Escolha a conta de destino.'); if (d.to === d.src) return toast('As contas de saída e destino precisam ser diferentes.'); }
  if (d.type !== 'despesa' && d.src.startsWith('c:')) return toast('Cartão só aceita despesas.');
  const isCard = d.src.startsWith('c:'), card = isCard ? cardMap()[d.src.slice(2)] : null;
  const base = {
    type: d.type, desc: d.desc.trim(), catId: d.type === 'transf' ? '' : d.catId, tags: d.type === 'transf' ? [] : d.tags, note: d.note.trim(),
    accountId: isCard ? '' : d.src.slice(2), cardId: isCard ? card.id : '', toAccountId: d.type === 'transf' ? d.to.slice(2) : '',
    paid: d.type === 'transf' ? true : isCard ? false : !!d.paid
  };
  base.paidDate = base.paid && d.type !== 'transf' ? (d.paidDate || d.date) : '';
  const touched = new Set();
  const put = t => { if (card) t.invoice = invoiceKey(card, t.date); const k = keyOf(t.date); (S.months[k] = S.months[k] || []).push(t); touched.add(k); };
  if (d.id){
    const f = findTx(d.id); if (!f) return closeModal();
    S.months[f.k].splice(f.i, 1); touched.add(f.k);
    put(Object.assign({ id: d.id, created: f.t.created || Date.now(), createdBy: f.t.createdBy || '', createdAt: f.t.createdAt || '', inst: f.t.inst || null, debtId: f.t.debtId || '', date: d.date, amount }, base));
  } else {
    const times = d.repeat === 'none' ? 1 : Math.max(2, Math.min(120, parseInt(d.times) || 2));
    const group = times > 1 ? newId() : null, now = Date.now();
    let parts = [];
    if (d.repeat === 'parc'){ const each = Math.floor(amount / times * 100) / 100; for (let i = 0; i < times; i++) parts.push(i === times - 1 ? r2(amount - each * (times - 1)) : each); }
    else parts = Array(times).fill(amount);
    parts.forEach((a, i) => {
      const date = addMonthsDate(d.date, i);
      const paid = d.type === 'transf' ? true : isCard ? false : (i === 0 ? !!d.paid : false);
      put(Object.assign({ id: newId(), created: now + i, date, amount: a, inst: group ? { n: i + 1, total: times, group, fixed: d.repeat === 'fixo' } : null }, base, { paid, paidDate: paid && d.type !== 'transf' ? (i === 0 ? base.paidDate : date) : '' }));
    });
    lsSet('caixa.lastsrc.' + S.area, d.src);
  }
  touched.forEach(k => Store.saveMonth(k));
  const edit = !!d.id; closeModal(); render(); toast(edit ? 'Lançamento atualizado' : 'Lançamento salvo');
}
function addTagFromDraftSilent(){ const d = S.draft, n = (d.newTag || '').trim(); if (!n) return; let t = st().tags.find(x => x.name.toLowerCase() === n.toLowerCase()); if (!t){ t = { id: newId(), name: n }; st().tags.push(t); Store.saveSettings(); } else if (t.archived){ t.archived = false; Store.saveSettings(); } if (!d.tags.includes(t.id)) d.tags.push(t.id); d.newTag = ''; }
function deleteTx(id, next){
  const f = findTx(id); if (!f) return;
  const touched = new Set();
  if (next && f.t.inst){
    const g = f.t.inst.group, from = f.t.inst.n;
    for (const k in S.months){ const before = S.months[k].length; S.months[k] = S.months[k].filter(t => !(t.inst && t.inst.group === g && t.inst.n >= from)); if (S.months[k].length !== before) touched.add(k); }
  } else { S.months[f.k].splice(f.i, 1); touched.add(f.k); }
  touched.forEach(k => Store.saveMonth(k)); closeModal(); render(); toast('Lançamento excluído');
}

/* ---------- resumo do lançamento ---------- */
function situacao(t){
  if (t.type === 'transf') return 'Transferência entre contas';
  if (t.type === 'fatura') return `Pago em ${fmtDate(payDay(t))}`;
  if (t.cardId){ const c = cardMap()[t.cardId]; return `No cartão${c ? ' ' + c.name : ''} · fatura que vence em ${c && t.invoice ? fmtDate(invDue(c, t.invoice)) : '?'}`; }
  if (t.paid) return `${t.type === 'receita' ? 'Recebido' : 'Pago'} em ${fmtDate(payDay(t))}`;
  const late = t.date < todayStr();
  return `<span class="${late ? 'late' : ''}">${t.type === 'receita' ? 'A receber' : 'A pagar'}${late ? ` · vencido há ${daysLate(t.date)} dia${daysLate(t.date) > 1 ? 's' : ''}` : ''}</span>`;
}

  S.draft = { id, back: back || '', date: todayStr(), src: 'a:' + t.accountId, amount: String(t.amount).replace('.', ',') };
  S.modal = () => { const d = S.draft, r = t.type === 'receita';
    return mhead(r ? 'Registrar recebimento' : 'Dar baixa') + `<div class="mbody">

    </div><div class="mfoot"><button class="btn" data-act="${d.back ? 'overdue' : 'close'}">${d.back ? 'Voltar' : 'Cancelar'}</button><button class="btn primary" data-act="savebaixa">Confirmar ${r ? 'recebimento' : 'baixa'}</button></div>`; };

function saveBaixa(){
  const d = S.draft, f = findTx(d.id); if (!f) return closeModal();
  const t = f.t, amount = parseMoney(d.amount);
  if (!(amount > 0)) return toast('Informe o valor.'); if (!d.date) return toast('Informe a data.'); if (!d.src) return toast('Escolha a conta.');
  if (amount !== t.amount) t.note = [t.note, `Valor original ${money(t.amount)}`].filter(Boolean).join(' · ');
  Object.assign(t, { paid: true, paidDate: d.date, accountId: d.src.slice(2), amount });
  Store.saveMonth(f.k);
  toast(t.type === 'receita' ? 'Recebimento registrado' : 'Baixa registrada');
  if (d.back && overdue().count) overdueModal(); else closeModal();
  render();
}

/* ---------- dívidas negativadas ----------
 * Registro de consulta: não entra em saldos. Ao negociar, o pagamento (à vista) ou as parcelas viram
 * lançamentos normais com debtId, na categoria da dívida — esses sim entram no previsto e nos relatórios.
 */
const DEBT_ST = { aberta: 'Em aberto', negociacao: 'Em negociação', acordo: 'Acordo fechado', quitada: 'Quitada' };
const DEBT_ORDER = { aberta: 0, negociacao: 1, acordo: 2, quitada: 3 };
const debtTx = id => allTx().filter(t => t.debtId === id).sort((a, b) => a.date < b.date ? -1 : 1);
function debtOwed(d){ // quanto ainda falta
  if (d.status === 'quitada') return 0;
  if (d.status === 'acordo') return r2(debtTx(d.id).filter(t => !settled(t)).reduce((s, t) => s + t.amount, 0));
  return Number(d.current) || Number(d.original) || 0;
}
function debtSummary(){ const open = live('debts').filter(d => d.status !== 'quitada'); return { n: open.length, total: r2(open.reduce((s, d) => s + debtOwed(d), 0)) }; }
const refToMonth = r => /^\d{2}\/\d{4}$/.test(r || '') ? `${r.slice(3)}-${r.slice(0, 2)}` : '';
const monthToRef = m => /^\d{4}-\d{2}$/.test(m || '') ? `${m.slice(5)}/${m.slice(0, 4)}` : '';

function viewDebts(){
  const tab = S.debtTab || 'abertas', all = live('debts'), cm = catMap();
  const list = all.filter(d => tab === 'todas' || (tab === 'quitadas' ? d.status === 'quitada' : d.status !== 'quitada'))
    .sort((a, b) => (DEBT_ORDER[a.status] || 0) - (DEBT_ORDER[b.status] || 0) || String(a.creditor).localeCompare(String(b.creditor)));
  const open = all.filter(d => d.status !== 'quitada');
  const tabs = `<div class="tabs" role="group">${[['abertas', 'Em aberto'], ['quitadas', 'Quitadas'], ['todas', 'Todas']].map(([v, l]) => `<button data-act="debttab" data-v="${v}" aria-pressed="${tab === v}">${l}</button>`).join('')}<button class="btn primary small" style="margin-left:auto" data-act="newdebt">Nova dívida</button></div>`;
  const sum = `<div class="sumbar top">
    <div><span class="muted">Em aberto</span><b>${open.length}</b></div>
    <div><span class="muted">Valor original</span><b>${money(open.reduce((s, d) => s + (Number(d.original) || 0), 0))}</b></div>
    <div><span class="muted">Ainda devido</span><b class="out">${money(open.reduce((s, d) => s + debtOwed(d), 0))}</b></div>
  </div>`;
  const cards = list.map(d => {
    const c = cm[d.catId], txs = debtTx(d.id), paid = txs.filter(settled), paidSum = r2(paid.reduce((s, t) => s + t.amount, 0));
    const stColor = d.status === 'quitada' ? 'var(--in)' : d.status === 'acordo' ? 'var(--brand)' : d.status === 'negociacao' ? 'var(--warn)' : 'var(--out)';
    const deal = d.status === 'acordo' || (d.status === 'quitada' && d.dealKind) ? `<div class="dealbox">
        <div><small>Acordo</small><b>${money(d.dealAmount)}</b><small>${d.dealKind === 'parcelado' ? `${d.dealN}× a partir de ${d.dealDate ? fmtDate(d.dealDate) : '?'}` : `à vista${d.dealDate ? ' em ' + fmtDate(d.dealDate) : ''}`}</small></div>
        <div><small>Pago</small><b class="in">${money(paidSum)}</b><small>${paid.length} de ${txs.length} lançamento${txs.length > 1 ? 's' : ''}</small></div>
        <div><small>Restante</small><b class="${debtOwed(d) ? 'out' : ''}">${money(debtOwed(d))}</b></div>
        <div class="limit" style="grid-column:1/-1"><i style="width:${d.dealAmount ? Math.min(100, paidSum / d.dealAmount * 100) : 0}%;background:var(--in)"></i></div>
      </div>` : '';
    const acts = [
      `<button class="iconbtn" data-act="editdebt" data-id="${d.id}">Editar</button>`,
      d.status === 'aberta' || d.status === 'negociacao' ? `<button class="iconbtn" data-act="negotiate" data-id="${d.id}">Negociar</button>` : '',
      txs.length ? `<button class="iconbtn" data-act="debtparc" data-id="${d.id}">${S.debtOpen[d.id] ? 'Ocultar' : 'Ver'} lançamentos</button>` : '',
      d.status === 'acordo' && !debtOwed(d) ? `<button class="iconbtn" data-act="quitdebt" data-id="${d.id}">Marcar como quitada</button>` : '',
      d.status === 'acordo' ? `<button class="iconbtn" data-act="canceldeal" data-id="${d.id}">Cancelar acordo</button>` : '',
      `<button class="iconbtn" data-act="deldebt" data-id="${d.id}">Excluir</button>`
    ].join('');
    return `<section class="panel debt">
      <h2><span>${esc(d.creditor)}</span><span class="status" style="color:${stColor}">${DEBT_ST[d.status] || d.status}</span></h2>
      <div class="hint" style="margin:-8px 0 12px">${[d.contract ? 'Contrato ' + esc(d.contract) : '', d.ref ? 'ref. ' + esc(d.ref) : '', c ? esc(catLabel({ type: 'despesa', catId: c.id })) : 'Sem categoria'].filter(Boolean).join(' · ')}</div>
      <div class="inv">
        <div><small>Valor original</small><b>${money(d.original)}</b></div>
        <div><small>Valor atualizado</small><b>${d.current ? money(d.current) : '—'}</b>${d.currentAt ? `<small>em ${fmtDate(d.currentAt)}</small>` : ''}</div>
      </div>
      ${deal}
      ${d.note ? `<p class="hint" style="margin:0 0 10px">${esc(d.note)}</p>` : ''}
      <div class="acts wrap">${acts}</div>
      ${S.debtOpen[d.id] && txs.length ? `<div class="list" style="margin-top:12px">${txs.map(t => txRow(t)).join('')}</div>` : ''}
    </section>`;
  }).join('');
  const empty = `<div class="panel"><div class="empty"><b>${tab === 'quitadas' ? 'Nenhuma dívida quitada ainda' : all.length ? 'Nenhuma dívida em aberto' : 'Nenhuma dívida registrada'}</b>${all.length ? '' : 'Registre aqui dívidas negativadas para consulta: credor, contrato, valores. Quando negociar, o pagamento ou as parcelas entram nas contas a pagar.'}${tab !== 'quitadas' ? '<br><button class="btn primary" data-act="newdebt">Registrar dívida</button>' : ''}</div></div>`;
  return topbar('Dívidas negativadas', false, `<button class="back" data-act="view" data-v="contas">‹ Contas</button>`) + tabs + sum + `<div class="debts">${cards || empty}</div>`;
}

function saveDebt(){
  const x = S.draft; if (!x.creditor.trim()) return toast('Informe o credor.');
  const original = parseMoney(x.original); if (!(original > 0)) return toast('Informe o valor original.');
  const cur = x.current === '' ? 0 : parseMoney(x.current);
  const old = x.id ? st().debts.find(d => d.id === x.id) : null;
  const d = Object.assign(old ? clone(old) : { id: newId(), dealKind: '', dealAmount: 0, dealN: 0, dealDate: '' },
    { creditor: x.creditor.trim(), contract: x.contract.trim(), ref: monthToRef(x.refm), original, current: cur, catId: x.catId, status: x.status, note: x.note.trim() });
  d.currentAt = cur && (!old || old.current !== cur) ? todayStr() : (old ? old.currentAt : '');
  const i = st().debts.findIndex(y => y.id === d.id); if (i >= 0) st().debts[i] = d; else st().debts.push(d);
  Store.saveSettings(); closeModal(); render(); toast('Dívida salva');
}

function saveDeal(){
  const x = S.draft, d = st().debts.find(y => y.id === x.id), amount = parseMoney(x.amount);
  if (!(amount > 0)) return toast('Informe o valor do acordo.'); if (!x.date) return toast('Informe a data.'); if (!x.src) return toast('Escolha a conta ou cartão.');
  const isCard = x.src.startsWith('c:'), card = isCard ? cardMap()[x.src.slice(2)] : null;
  const n = x.kind === 'parcelado' ? Math.max(2, Math.min(120, parseInt(x.n) || 2)) : 1, group = n > 1 ? newId() : null, now = Date.now();
  const each = Math.floor(amount / n * 100) / 100;
  for (let i = 0; i < n; i++){
    const date = addMonthsDate(x.date, i), paid = !isCard && n === 1 && !!x.paid;
    const t = { id: newId(), created: now + i, type: 'despesa', date, amount: i === n - 1 ? r2(amount - each * (n - 1)) : each,
      desc: 'Acordo ' + d.creditor, catId: d.catId, tags: [], note: d.contract ? 'Contrato ' + d.contract : '', accountId: isCard ? '' : x.src.slice(2), cardId: isCard ? card.id : '', toAccountId: '',
      paid, paidDate: paid ? date : '', debtId: d.id, inst: group ? { n: i + 1, total: n, group, fixed: false } : null };
    if (card) t.invoice = invoiceKey(card, date);
    const k = keyOf(date); (S.months[k] = S.months[k] || []).push(t);
  }
  Object.assign(d, { status: n === 1 && (x.paid || isCard) ? 'quitada' : 'acordo', dealKind: x.kind, dealAmount: amount, dealN: n, dealDate: x.date });
  Store.saveSettings(); closeModal(); render();
  toast(d.status === 'quitada' ? 'Acordo registrado e dívida quitada' : `Acordo registrado: ${n > 1 ? n + ' parcelas' : 'pagamento'} nas contas a pagar`, 4000);
}
function cancelDeal(id){
  const d = st().debts.find(y => y.id === id), open = debtTx(id).filter(t => !settled(t));
