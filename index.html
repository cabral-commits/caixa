function saveCard(){
  const d = S.draft; if (!d.name.trim()) return toast('Dê um nome para o cartão.');
  const cd = parseInt(d.closeDay), dd = parseInt(d.dueDay);
  if (!(cd >= 1 && cd <= 31) || !(dd >= 1 && dd <= 31)) return toast('Os dias precisam estar entre 1 e 31.');
  const c = { id: d.id || newId(), name: d.name.trim(), closeDay: cd, dueDay: dd, limit: parseMoney(d.limit), payAccount: d.payAccount, color: d.color };
  const i = st().cards.findIndex(x => x.id === c.id);
  if (i >= 0){ st().cards[i] = c; const touched = new Set(); for (const k in S.months) S.months[k].forEach(t => { if (t.cardId === c.id && t.type === 'despesa'){ const nk = invoiceKey(c, t.date); if (t.invoice !== nk){ t.invoice = nk; touched.add(k); } } }); touched.forEach(k => Store.saveMonth(k)); }
  else st().cards.push(c);
  Store.saveSettings(); closeModal(); render(); toast('Cartão salvo');
}
function payModal(cardId, key){
  const c = cardMap()[cardId], I = invoiceInfo(c, key);
  S.draft = { cardId, key, src: 'a:' + (c.payAccount && accMap()[c.payAccount] && !accMap()[c.payAccount].archived ? c.payAccount : (live('accounts')[0] || {}).id), date: todayStr(), amount: String(I.total).replace('.', ',') };
  S.modal = () => { const d = S.draft; return mhead('Pagar fatura — ' + esc(c.name)) + `<div class="mbody">
    <p class="hint" style="margin:0">Fatura com vencimento em ${fmtDate(I.dueDate)}: ${money(I.total)}. O pagamento sai da conta escolhida e não conta de novo como despesa nos relatórios (as compras já contaram).</p>
    <div class="two"><div class="f amount"><label for="p-amount">Valor pago (R$)</label><input id="p-amount" inputmode="decimal" data-d="amount" value="${esc(d.amount)}"></div><div class="f"><label for="p-date">Data do pagamento</label><input id="p-date" type="date" data-d="date" value="${esc(d.date)}"></div></div>
    <div class="f"><label for="p-src">Conta</label><select id="p-src" data-d="src">${srcOptions(d.src, false)}</select></div>
  </div><div class="mfoot"><button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="savepay">Registrar pagamento</button></div>`; };
  openModal(S.modal());
}
function savePay(){
  const d = S.draft, c = cardMap()[d.cardId], amount = parseMoney(d.amount);
  if (!(amount > 0)) return toast('Informe o valor pago.'); if (!d.src) return toast('Escolha a conta.'); if (!d.date) return toast('Informe a data.');
  const t = { id: newId(), created: Date.now(), type: 'fatura', desc: 'Fatura ' + c.name, amount, date: d.date, paidDate: d.date, accountId: d.src.slice(2), cardId: c.id, invoice: d.key, paid: true, tags: [], note: '', catId: '', toAccountId: '' };
  const k = keyOf(d.date); (S.months[k] = S.months[k] || []).push(t); Store.saveMonth(k); closeModal(); render(); toast('Fatura paga');
}
/* categoria */
function catModal(cat, opts = {}){
  const parent = opts.parent ? catMap()[opts.parent] : null;
  S.draft = cat ? clone(cat) : { id: null, name: '', type: parent ? parent.type : opts.type, parent: parent ? parent.id : null, color: parent ? parent.color : COLORS[st().cats.filter(c => !c.parent).length % COLORS.length] };
  S.modal = () => { const d = S.draft, cm = catMap(); const groups = st().cats.filter(c => !c.archived && !c.parent && c.type === d.type && c.id !== d.id);
    const hasKids = d.id && st().cats.some(c => !c.archived && c.parent === d.id);
    return mhead(d.id ? 'Editar categoria' : d.parent ? 'Nova subcategoria' : 'Nova categoria') + `<div class="mbody">
    <div class="f"><label for="k-name">Nome</label><input id="k-name" data-d="name" value="${esc(d.name)}" autofocus></div>
    ${hasKids ? '' : `<div class="f"><label for="k-parent">Fica dentro de</label><select id="k-parent" data-d="parent"><option value="">— categoria principal —</option>${groups.map(g => `<option value="${g.id}" ${d.parent === g.id ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}</select></div>`}
    ${!d.parent ? `<div class="f"><label>Cor</label>${colorPick(d.color)}</div>` : `<p class="hint" style="margin:0">Subcategorias usam a cor de ${esc((cm[d.parent] || {}).name || 'categoria principal')}.</p>`}
  </div><div class="mfoot"><button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="savecat">Salvar categoria</button></div>`; };
  openModal(S.modal());
}
function saveCat(){
  const d = S.draft; if (!d.name.trim()) return toast('Dê um nome para a categoria.');
  const cm = catMap(), parent = d.parent ? cm[d.parent] : null;
  const c = { id: d.id || newId(), name: d.name.trim(), type: d.type, parent: parent ? parent.id : null, color: parent ? parent.color : d.color };
  const i = st().cats.findIndex(x => x.id === c.id);
  if (i >= 0){ st().cats[i] = c; if (!c.parent) st().cats.forEach(x => { if (x.parent === c.id) x.color = c.color; }); } else st().cats.push(c);
  Store.saveSettings(); closeModal(); render(); toast('Categoria salva');
}
function tagModal(t){
  S.draft = t ? clone(t) : { id: null, name: '' };
  S.modal = () => mhead(S.draft.id ? 'Editar tag' : 'Nova tag') + `<div class="mbody"><div class="f"><label for="t-name">Nome</label><input id="t-name" data-d="name" value="${esc(S.draft.name)}" autofocus></div></div><div class="mfoot"><button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="savetag">Salvar tag</button></div>`;
  openModal(S.modal());
}
function saveTag(){
  const d = S.draft, n = d.name.trim(); if (!n) return toast('Dê um nome para a tag.');
  if (live('tags').some(x => x.id !== d.id && x.name.toLowerCase() === n.toLowerCase())) return toast('Já existe uma tag com esse nome.');
  const i = st().tags.findIndex(x => x.id === d.id); if (i >= 0) st().tags[i].name = n; else st().tags.push({ id: newId(), name: n });
  Store.saveSettings(); closeModal(); render(); toast('Tag salva');
}
function confirmModal(msg, act, id, label = 'Excluir'){
  S.modal = () => mhead('Confirmar') + `<div class="mbody"><p style="margin:0">${msg}</p></div><div class="mfoot"><button class="btn" data-act="close">Cancelar</button><button class="btn primary" style="background:var(--out);border-color:var(--out)" data-act="${act}" data-id="${id}">${label}</button></div>`;
  openModal(S.modal());
}

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, v = el.dataset.v, id = el.dataset.id;
  if (act === 'overlay'){ if (e.target === el) closeModal(); return; }
  switch (act){
    case 'view': S.view = v; if (v === 'contas') S.acc = null; if ($('#modal-root').innerHTML) closeModal(); render(); window.scrollTo(0, 0); break;
    case 'month': S.month = addMonthsKey(S.month, Number(v)); render(); break;
    case 'newtx': if (!st()) return; if (!live('accounts').length && !live('cards').length){ toast('Cadastre uma conta primeiro.'); accModal(); break; } showTx(newDraft()); break;
    case 'edit': detailModal(id); break;
    case 'edittx': { const f = findTx(id); if (f) showTx(draftFromTx(f.t)); break; }
    case 'replicate': { const f = findTx(id); if (!f) break; const d = draftFromTx(f.t); Object.assign(d, { id: null, date: todayStr(), paid: true, paidDate: '', inst: null, created: null, createdBy: '', createdAt: '' }); showTx(d); toast('Cópia pronta: confira a data e salve'); break; }
    case 'askdel': askDelete(id); break;
    case 'baixa': baixaModal(id, el.dataset.back); break;
    case 'savebaixa': saveBaixa(); break;
    case 'estorno': { const f = findTx(id); if (!f) break; f.t.paid = false; f.t.paidDate = ''; Store.saveMonth(f.k); render(); if (S.modal) rerenderModal(); toast('Baixa estornada: voltou a ficar pendente'); break; }
    case 'overdue': overdueModal(); break;
    case 'payinvk': payModal(v, el.dataset.k); break;
    case 'openacc': S.acc = id; S.month = keyOf(todayStr()); render(); window.scrollTo(0, 0); break;
    case 'accback': S.acc = null; render(); window.scrollTo(0, 0); break;
    case 'gocardinv': S.cardSel = v; S.month = el.dataset.k; S.view = 'cartoes'; closeModal(); render(); window.scrollTo(0, 0); break;
    case 'regime': S.rep.regime = v; render(); break;
    case 'linkother': linkModal(); break;
    case 'debttab': S.debtTab = v; render(); break;
    case 'debtparc': S.debtOpen[id] = !S.debtOpen[id]; render(); break;
    case 'newdebt': debtModal(); break;
    case 'editdebt': debtModal(st().debts.find(x => x.id === id)); break;
    case 'savedebt': saveDebt(); break;
    case 'negotiate': if (!live('accounts').length && !live('cards').length){ toast('Cadastre uma conta primeiro.'); break; } dealModal(id); break;
    case 'dealkind': S.draft.kind = v; rerenderModal(); break;
    case 'savedeal': saveDeal(); break;
    case 'canceldeal': { const n = debtTx(id).filter(t => !settled(t)).length; confirmModal(`Cancelar o acordo? ${n} lançamento${n > 1 ? 's' : ''} ainda em aberto ${n > 1 ? 'vão' : 'vai'} para a Lixeira; os já pagos continuam. A dívida volta para "Em negociação".`, 'docanceldeal', id, 'Cancelar acordo'); break; }
    case 'docanceldeal': cancelDeal(id); break;
    case 'quitdebt': { const d = st().debts.find(x => x.id === id); d.status = 'quitada'; Store.saveSettings(); render(); toast('Dívida quitada'); break; }
    case 'deldebt': confirmModal(`Excluir a dívida com ${esc(st().debts.find(x => x.id === id).creditor)}? Os lançamentos ligados a ela continuam. Você pode restaurar na aba Lixeira dos Cadastros.`, 'dodeldebt', id); break;
    case 'dodeldebt': st().debts.find(x => x.id === id).archived = true; Store.saveSettings(); closeModal(); render(); toast('Dívida excluída (está na Lixeira)'); break;
    case 'savelink': saveLink(); break;
    case 'pair': {
      const c = ($('#pair-code') || {}).value || '';
      if (c.replace(/[^a-z0-9]/gi, '').length < 8){ toast('Digite os 8 caracteres do código.'); break; }
      el.disabled = true; el.textContent = 'Conectando…';
      window.CAIXA_PWA.pair(c).then(r => {
        if (r.switched){ location.search = '?app=' + encodeURIComponent(r.appId); return; } // o código era da outra planilha: abre ela
        toast('Aparelho conectado como ' + r.name, 4000); S.error = ''; S.loaded = false; render(); Store.load(); })
        .catch(err => { el.disabled = false; el.textContent = 'Conectar'; const m = errMsg(err);
          toast(/CODIGO_INVALIDO/.test(m) ? 'Código inválido ou vencido. Gere outro na planilha: ele vale 15 minutos e uma única vez.' : /NetworkError/.test(m) ? 'Sem conexão com a planilha. Confira a internet e tente de novo.' : m, 6000); });
      break;
    }
    case 'disconnect': confirmModal('Desconectar este aparelho? Os dados guardados nele são apagados e, para usar de novo, será preciso um novo código.', 'dodisconnect', '', 'Desconectar'); break;
    case 'dodisconnect':
      if (Store.outbox.length){ closeModal(); toast('Ainda há alterações não enviadas. Espere a conexão voltar antes de desconectar.', 5000); break; }
      lsDel(Store.cacheKey()); window.CAIXA_PWA.disconnect(); location.reload(); break;
    case 'unlinkother': S.otherUrl = ''; Store.setCfg('link_outro', ''); closeModal(); render(); toast('Ligação removida'); break;
    case 'toggle': { const f = findTx(id); if (!f) return; f.t.paid = !f.t.paid; f.t.paidDate = f.t.paid ? todayStr() : ''; Store.saveMonth(f.k); render(); toast(f.t.paid ? (f.t.type === 'receita' ? 'Recebido hoje' : 'Pago hoje') + ' — para outra data, toque no lançamento' : 'Voltou a ficar pendente', 3500); break; }
    case 'dtype': { const d = S.draft; d.type = v; if (v !== 'despesa' && d.src.startsWith('c:')) d.src = live('accounts')[0] ? 'a:' + live('accounts')[0].id : ''; const cm = catMap(); if (d.catId && (!cm[d.catId] || cm[d.catId].type !== v)) d.catId = ''; rerenderModal(); break; }
    case 'dtag': { const d = S.draft, i = d.tags.indexOf(v); if (i >= 0) d.tags.splice(i, 1); else d.tags.push(v); rerenderModal(); break; }
    case 'savetx': saveTx(); break;
    case 'deltx': deleteTx(S.draft.id, false); break;
    case 'deltxnext': deleteTx(S.draft.id, true); break;
    case 'close': closeModal(); break;
    case 'expand': S.expand[v] = !S.expand[v]; render(); break;
    case 'gocard': S.cardSel = v; S.view = 'cartoes'; render(); break;
    case 'clearf': S.filters = { q: '', src: '', cat: '', tag: '', type: '', status: '' }; render(); break;
    case 'cardsel': S.cardSel = v; render(); break;
    case 'payinv': if (!live('accounts').length){ toast('Cadastre uma conta para pagar a fatura.'); break; } payModal(S.cardSel, S.month); break;
    case 'savepay': savePay(); break;
    case 'unpay': { const f = findTx(id); if (f){ S.months[f.k].splice(f.i, 1); Store.saveMonth(f.k); } closeModal(); render(); toast('Pagamento desfeito'); break; }
    case 'sub': S.sub = v; render(); break;
    case 'newacc': accModal(); break;
    case 'editacc': accModal(accMap()[id]); break;
    case 'saveacc': saveAcc(); break;
    case 'delacc': confirmModal(`Excluir a conta ${esc(accMap()[id].name)}? ${isUsed(id) ? 'Os lançamentos dela continuam guardados e mostrando o nome. ' : ''}Você pode restaurar na aba Lixeira.`, 'dodelacc', id); break;
    case 'dodelacc': accMap()[id].archived = true; Store.saveSettings(); closeModal(); render(); toast('Conta excluída (está na Lixeira)'); break;
    case 'newcard': cardModal(); break;
    case 'editcard': cardModal(cardMap()[id]); break;
    case 'savecard': saveCard(); break;
    case 'delcard': confirmModal(`Excluir o cartão ${esc(cardMap()[id].name)}? ${isUsed(id) ? 'As compras dele continuam guardadas. ' : ''}Você pode restaurar na aba Lixeira.`, 'dodelcard', id); break;
    case 'dodelcard': cardMap()[id].archived = true; Store.saveSettings(); closeModal(); render(); toast('Cartão excluído (está na Lixeira)'); break;
    case 'newcat': catModal(null, { type: el.dataset.type }); break;
    case 'newsub': catModal(null, { parent: id }); break;
    case 'editcat': catModal(catMap()[id]); break;
    case 'savecat': saveCat(); break;
    case 'delcat': { const kids = st().cats.filter(c => !c.archived && c.parent === id); if (kids.length) toast('Exclua as subcategorias primeiro.'); else confirmModal(`Excluir a categoria ${esc(catMap()[id].name)}? ${isUsed(id) ? 'Os lançamentos dela continuam guardados e mostrando o nome. ' : ''}Você pode restaurar na aba Lixeira.`, 'dodelcat', id); break; }
    case 'dodelcat': catMap()[id].archived = true; Store.saveSettings(); closeModal(); render(); toast('Categoria excluída (está na Lixeira)'); break;
    case 'newtag': tagModal(); break;
    case 'edittag': tagModal(tagMap()[id]); break;
    case 'savetag': saveTag(); break;
    case 'deltag': confirmModal(`Excluir a tag ${esc(tagMap()[id].name)}? Ela some da lista, mas os lançamentos continuam marcados. Você pode restaurar na aba Lixeira.`, 'dodeltag', id); break;
    case 'dodeltag': tagMap()[id].archived = true; Store.saveSettings(); closeModal(); render(); toast('Tag excluída (está na Lixeira)'); break;
    case 'restoretx': { const i = S.trash.findIndex(x => x.id === id); if (i < 0) break; const t = S.trash.splice(i, 1)[0]; delete t.deletedAt; delete t.deletedBy; const k = keyOf(t.date); (S.months[k] = S.months[k] || []).push(t); Store.saveMonth(k); render(); toast('Lançamento restaurado em ' + monthLabel(k).toLowerCase()); break; }
    case 'restorecad': { const x = st()[el.dataset.set].find(y => y.id === id); if (x){ x.archived = false; Store.saveSettings(); render(); toast('Restaurado'); } break; }
    case 'pickcolor': S.draft.color = v; rerenderModal(); break;
    case 'reload': if (Store.pendingWork()){ Store.flush(); toast(Store.offline ? 'Sem conexão com a planilha. Suas alterações estão guardadas no aparelho e serão enviadas.' : 'Aguarde terminar de salvar.', 5000); break; } S.loaded = false; render(); Store.load(); break;
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.f){ S.filters[el.dataset.f] = el.value; render(); return; }
  if (el.dataset.r){ S.rep[el.dataset.r] = el.value; if (el.dataset.r === 'preset' && el.value === 'custom'){ const [a, b] = repRange(); S.rep.from = S.rep.from || a; S.rep.to = S.rep.to || b; } render(); return; }
  if (el.dataset.d && S.draft) S.draft[el.dataset.d] = el.type === 'checkbox' ? el.checked : el.value;
});
document.addEventListener('change', e => {
  const el = e.target;
  if (!el.dataset.d || !S.draft || !S.modal) return;
  const k = el.dataset.d; S.draft[k] = el.type === 'checkbox' ? el.checked : el.value;
  const txKeys = ['src','repeat','times','date','amount','paid'];
  if ((S.modal === txModal && txKeys.includes(k)) || (S.modal !== txModal && (el.tagName === 'SELECT' || ['amount', 'n', 'paid'].includes(k)))) rerenderModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modal-root').innerHTML) closeModal();
  if (e.key === 'Enter' && e.target.id === 'd-newtag'){ e.preventDefault(); addTagFromDraft(); return; }
  if (e.key === 'Enter' && e.target.id === 'pair-code'){ e.preventDefault(); const b = $('[data-act="pair"]'); if (b) b.click(); return; }
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('row')){ e.target.click(); }
  if (e.key === 'Enter' && e.target.closest && e.target.closest('.modal') && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox'){ const p = $('.modal .btn.primary'); if (p){ e.preventDefault(); p.click(); } }
});

render();
Store.init();
</script>
</body>
</html>
